[package]
name = "jelly-dedup"
version = "0.1.2"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
dotenv = "0.15"
shell-escape = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
